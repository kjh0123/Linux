html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans KR",system-ui,sans-serif}
header{background:var(--side);color:#f3e6ef;padding:18px clamp(16px,4vw,40px)}
header h1{margin:0;font-size:20px}
main{max-width:720px;margin:0 auto;padding:24px 16px 70px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}
h2{margin:0 0 6px;font-size:22px}
.mute{color:var(--mute);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chip{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:14.5px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--acc);background:var(--acc);color:#fff}
.btn{font:inherit;font-weight:700;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 24px;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.meta{display:flex;justify-content:space-between;font-size:13.5px;color:var(--mute);margin-bottom:8px}
.q{font-size:19px;font-weight:700;margin:4px 0 16px;line-height:1.55;white-space:pre-wrap}
.opt{display:block;width:100%;text-align:left;font:inherit;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:11px 14px;margin:8px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.opt.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.opt:disabled{cursor:default}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ox .opt{text-align:center;font-size:28px;font-weight:700;padding:16px}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.no{background:var(--nobg);color:var(--no)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.score{font-size:48px;font-weight:700;color:var(--acc);line-height:1.2}
ul.w{padding-left:20px}ul.w li{margin:8px 0}
.ch{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
</style>
</head>

function cnt(){return Q.filter(function(q){return sel[q.c]}).length}
function home(){
 app.innerHTML="";var c=el("div","card");c.appendChild(el("h2",0,"범위를 고르고 시작하세요"));
 c.appendChild(el("p","mute","강의 02–09 내용으로 만든 "+Q.length+"문제입니다. 풀면 바로 정답과 해설이 나오고, 틀린 문제만 다시 풀 수 있어요."));
 var ch=el("div","chips");CH.forEach(function(n,k){var b=el("button","chip",n+" "+Q.filter(function(q){return q.c==k}).length);b.setAttribute("aria-pressed",sel[k]);b.onclick=function(){sel[k]=!sel[k];home()};ch.appendChild(b)});
 c.appendChild(ch);
 var r=el("div","row"),s=el("button","btn","선택한 "+cnt()+"문제 시작");s.disabled=!cnt();s.onclick=function(){start(shuf(Q.filter(function(q){return sel[q.c]})))};
 r.appendChild(s);var all=el("button","btn alt","전체 선택/해제");all.onclick=function(){var v=sel.some(function(x){return !x});sel=sel.map(function(){return v});home()};r.appendChild(all);
 c.appendChild(r);app.appendChild(c);
}
function start(p){pool=p;i=0;score=0;wrong=[];by={};show()}
function show(){
 app.innerHTML="";done=false;var q=pool[i],c=el("div","card");
 var bar=el("div","bar"),f=el("i");f.style.width=(i/pool.length*100)+"%";bar.appendChild(f);c.appendChild(bar);
 var m=el("div","meta");m.appendChild(el("span",0,(i+1)+" / "+pool.length+" · "+CH[q.c]));m.appendChild(el("span",0,"정답 "+score));c.appendChild(m);
 c.appendChild(el("div","q",q.q));
 var o=q.ox?q.o:shuf(q.o),box=el("div",q.ox?"ox":""),bs=[];
 o.forEach(function(t,k){var b=el("button","opt",q.ox?t:(k+1)+". "+t);b.onclick=function(){ans(q,t,bs,fb,nx,o.indexOf(t))};bs.push([b,t]);box.appendChild(b)});
 c.appendChild(box);var fb=el("div"),nx=el("div","row");c.appendChild(fb);c.appendChild(nx);app.appendChild(c);
 c._o=o;window._cur=function(k){if(!done&&bs[k])bs[k][0].click()};
}
function ans(q,t,bs,fb,nx){
 if(done)return;done=true;var ok=t==q.a;by[q.c]=by[q.c]||[0,0];by[q.c][1]++;
 if(ok){score++;by[q.c][0]++}else wrong.push(q);
 bs.forEach(function(x){x[0].disabled=true;if(x[1]==q.a)x[0].classList.add("ok");else if(x[1]==t)x[0].classList.add("no")});
 fb.className="fb "+(ok?"ok":"no");fb.textContent=(ok?"정답입니다. ":"오답입니다. 정답은 "+q.a+". ")+q.e;
 var b=el("button","btn",i+1<pool.length?"다음 문제":"결과 보기");b.onclick=next;nx.appendChild(b);b.focus();
}
function next(){i++;i<pool.length?show():result()}
function result(){
 app.innerHTML="";var c=el("div","card");c.appendChild(el("h2",0,"결과"));
 c.appendChild(el("div","score",score+" / "+pool.length));
 c.appendChild(el("p","mute","정답률 "+Math.round(score/pool.length*100)+"%"));
 CH.forEach(function(n,k){if(by[k]){var r=el("div","ch");r.appendChild(el("span",0,n));r.appendChild(el("span",0,by[k][0]+" / "+by[k][1]));c.appendChild(r)}});
 if(wrong.length){c.appendChild(el("h3",0,"틀린 문제 "+wrong.length+"개"));var u=el("ul","w");wrong.forEach(function(q){u.appendChild(el("li",0,q.q+" → "+q.a))});c.appendChild(u)}
 var r=el("div","row");
 if(wrong.length){var b=el("button","btn","틀린 문제만 다시 풀기");b.onclick=function(){start(shuf(wrong))};r.appendChild(b)}
 var h=el("button","btn alt","처음으로");h.onclick=home;r.appendChild(h);c.appendChild(r);app.appendChild(c);
}
addEventListener("keydown",function(e){if(e.key>="1"&&e.key<="4"&&window._cur&&pool&&app.querySelector(".opt"))window._cur(+e.key-1);else if(e.key=="o"||e.key=="O"){if(app.querySelector(".ox"))window._cur(0)}else if(e.key=="x"||e.key=="X"){if(app.querySelector(".ox"))window._cur(1)}});
home();
</script>
</body>
</html>
